[project]
name = "imperial-fs-telemetry"
version = "0.2.0"
description = "Review-led Formula Student EV drivetrain telemetry debrief and event detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
